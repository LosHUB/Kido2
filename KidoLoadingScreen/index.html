<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kido | Premium Loading Screen</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <div id="background-container">
        <div class="bg-image" style="background-image: url('default_bg.jpg');"></div>
    </div>

    <div class="overlay"></div>

    <div id="particles-js"></div>

    <div id="flash-overlay"></div>

    <div class="ui-wrapper">

        <div class="header">
            <img src="Logo.png" alt="Server Logo" class="main-logo" onerror="this.src='', this.style.display='none'">
            <div class="title-container">
                <h1 class="glow-text">KIDO</h1>
                <p class="subtitle">DEMON SLAYER <span class="divider">•</span> SERIOUS RP</p>
                <div class="discord-badge">
                    <svg viewBox="0 0 127.14 96.36" width="16" height="16" fill="white">
                        <path
                            d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77.7,77.7,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.1,46,96,53,91.08,65.69,84.69,65.69Z" />
                    </svg>
                    discord.gg/kidods
                </div>
            </div>
        </div>

        <div class="center-content">
            <div id="feature-block" class="feature-block">
                <h2 id="feature-title" class="feature-title">BIENVENUE</h2>
                <p id="feature-desc" class="feature-desc">Préparez-vous à entrer dans l'univers sombre et impitoyable
                    des
                    pourfendeurs.</p>
            </div>
        </div>

        <div class="footer">
            <div class="status-bar">
                <div class="status-info">
                    <span id="status-text">Initialisation du client...</span>
                </div>
                <div class="percentage-info">
                    <span id="percentage-text">0%</span>
                </div>
            </div>


            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
                <div id="progress-glow" class="progress-glow"></div>
            </div>

            <div class="player-info">
                <img id="player-avatar"
                    src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png?20150327203541"
                    alt="Avatar">
                <div class="player-details">
                    <div id="player-name">KIDO RP</div>
                    <div id="player-status">Validation Steam...</div>
                </div>
            </div>
        </div>

    </div>

    <input type="range" id="volume-control" min="0" max="1" step="0.05" value="0.2" style="display:none;">

    <audio id="bg-music" loop>
        <source src="" type="audio/mpeg">
    </audio>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
